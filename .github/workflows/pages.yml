name: Live data and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['native/**', 'docs/**', '*.md', 'prompts/**']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Fail closed if visibility changes or the owner has not confirmed $0 storage protection.
    if: github.repository == 'sebastienlato/G.O.S.I.P' && github.event.repository.private == false && vars.ZERO_COST_STORAGE_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm test
      - run: npm run ingest
      - run: npm run build:pages
      - name: Stamp source revision
        run: node -e 'require("fs").writeFileSync("dist/release.json", JSON.stringify({source_commit:process.env.GITHUB_SHA}))'
      - name: Enforce artifact budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const fs=require("fs"),p=require("path");function size(d){return fs.readdirSync(d,{withFileTypes:true}).reduce((n,e)=>n+(e.isDirectory()?size(p.join(d,e.name)):fs.statSync(p.join(d,e.name)).size),0)}if(size("dist")>4000000)throw Error("4 MB publication budget exceeded")'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/artifacts.json");if(a.total_count>100||a.artifacts.reduce((n,x)=>n+x.size_in_bytes,0)>100000000)throw Error("Artifact accumulation: stop and investigate")'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: artifact
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
  cleanup:
    needs: [build, deploy]
    if: always() && needs.build.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Delete this run's temporary artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
